# SIMULATED appointment calendar. Invented slots for testing.
# Read by src/communitybridge/simulated/calendar_api.py.
# SVC-ADL-CARD-01 has slots in November and December 2026 so the re-planning path
# ("next appointment window",) has somewhere to go. Visiting services only have
# slots on their visit dates in data/services/services.yaml.
# Every row states its mode. The telehealth row is the referred specialist's own telehealth consult,
# joined from the client's town and offered only when travel can't be arranged (offered_as:
# fallback_only). It is not a separately listed local service, so the §6.4.6 nearest-service check
# is unchanged and SC-01 stays eligible. Used by RP-01 in replan_scenarios.yaml.
# Listed telehealth services (mode telehealth in services.yaml) are joined from the hospital in
# their own town (offered_as: listed_service). Every service has at least one slot (C1 review).

