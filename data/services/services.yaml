# Synthetic, community-administered specialist service dataset.
# Every service, name and date is invented for testing; none is a real provider.
# In a real deployment this file would be maintained by the ACCHO (data governor, project plan).
#
# Design notes for the scenarios:
# - Cardiology exists only in Adelaide, so the core Ceduna -> Adelaide journey stays eligible
#   because the nearest service wins ( including telehealth and visiting services).
# - Ceduna has a visiting ophthalmology clinic and telehealth psychiatry/endocrinology, so
#   travel to Adelaide for those specialties tests §6.4.6 nearest and bypass rules.
# - SVC-WHY-DERM-V1 is deliberately stale (last_verified 2025-03-01) for the Verifier.
# - Physiotherapy is deliberately ineligible (allied health, §6.4.4).

# Which kind of health professional provides a specialty that is not a medical specialist.
# PATS §6.4.4 lists the excluded kinds ("allied health professionals", ...) but not which
# specialties belong to them, so the dataset says. Each value must be one of the
# ineligible_professionals entries in data/rules/pats_v26_4.yaml; a test checks that.
non_specialist_categories:
  Physiotherapy: allied health professionals

services:
  # ------------------------------------------------------------------ Adelaide (resident)
  - {service_id: SVC-ADL-CARD-01, name: Synthetic Adelaide Heart Clinic, specialty: Cardiology, town: ADELAIDE, mode: resident, source: CommunityBridge synthetic service dataset v1, last_verified: 2026-10-01, synthetic: true}
